name: "Run Hugo Go benchmark phase"
description: "Runs one Hugo Go cache provider and phase."

inputs:
  strategy:
    required: true
  cache_lane:
    required: true
  phase:
    required: true
  benchmark_id:
    required: true
  cli_version:
    required: false
    default: ""
  go_version:
    required: true

runs:
  using: composite
  steps:
    - name: Start the workflow timer
      id: workflow_timer
      shell: bash
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Checkout pinned Hugo source
      shell: bash
      run: |
        git submodule sync --recursive
        git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream
    - name: Verify the upstream benchmark recipe
      shell: bash
      run: python3 ./scripts/verify-upstream-recipe.py

    - name: Prepare clean Hugo source
      shell: bash
      env:
        PREPARE_PHASE: ${{ inputs.phase == 'warm' && 'warm1' || 'base' }}
      run: ./scripts/prepare-source.sh "$PREPARE_PHASE"

    - name: Select the cache cohort
      id: scope
      shell: bash
      env:
        CACHE_LANE: ${{ inputs.cache_lane }}
      run: |
        set -euo pipefail
        ref_slug="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
        ref_slug="${ref_slug#-}"
        ref_slug="${ref_slug%-}"
        ref_slug="${ref_slug:-main}"
        if [[ "$CACHE_LANE" == "rolling" ]]; then
          cache_scope="hugo-go-rolling-${ref_slug}"
        else
          cache_scope="hugo-go-run-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
        fi
        ./scripts/scope-boringcache-run.sh "$cache_scope"
        source_sha="$(git rev-parse HEAD:upstream)"
        echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"
        echo "cache_key=go-${cache_scope}-${source_sha}" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go_version }}
        cache: false

    - name: Start the provider setup timer
      id: setup_timer
      shell: bash
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Restore the GitHub Actions cache
      if: inputs.strategy == 'actions-cache' && inputs.phase == 'publish'
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/.go/build-cache
        key: ${{ steps.scope.outputs.cache_key }}
        restore-keys: |
          go-${{ steps.scope.outputs.cache_scope }}-

    - name: Restore the exact GitHub Actions cache
      if: inputs.strategy == 'actions-cache' && inputs.phase == 'warm'
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/.go/build-cache
        key: ${{ steps.scope.outputs.cache_key }}
        fail-on-cache-miss: true

    - name: Publish with BoringCache
      id: boringcache-publish
      if: inputs.strategy == 'boringcache' && inputs.phase == 'publish'
      uses: boringcache/one@e24257b122813ad11d53b9ed024b474ca4946ad2 # v1 / 1.19.1
      with:
        cli-version: ${{ inputs.cli_version }}
        setup: none
        mode: go
        trust-policy: publish
        working-directory: upstream
        fail-on-cache-error: true
        metadata-hints: benchmark=${{ inputs.benchmark_id }},phase=${{ inputs.cache_lane == 'rolling' && 'rolling' || 'fresh-cold' }}
      env:
        GOCACHE: ${{ github.workspace }}/.go/build-cache

    - name: Restore with BoringCache
      id: boringcache-restore
      if: inputs.strategy == 'boringcache' && inputs.phase == 'warm'
      uses: boringcache/one@e24257b122813ad11d53b9ed024b474ca4946ad2 # v1 / 1.19.1
      with:
        cli-version: ${{ inputs.cli_version }}
        setup: none
        mode: go
        trust-policy: restore
        working-directory: upstream
        fail-on-cache-miss: true
        fail-on-cache-error: true
        metadata-hints: benchmark=${{ inputs.benchmark_id }},phase=fresh-warm
      env:
        GOCACHE: ${{ github.workspace }}/.go/build-cache

    - name: Start the build timer
      id: build_timer
      shell: bash
      env:
        SETUP_STARTED_AT: ${{ steps.setup_timer.outputs.started_at }}
      run: |
        set -euo pipefail
        now="$(date +%s)"
        echo "setup_seconds=$(( now - SETUP_STARTED_AT ))" >> "$GITHUB_OUTPUT"
        echo "started_at=${now}" >> "$GITHUB_OUTPUT"
    - name: Build Hugo
      shell: bash
      env:
        GOCACHE: ${{ github.workspace }}/.go/build-cache
      run: python3 ./scripts/run-benchmark-plan.py go --working-directory upstream

    - name: Capture the build timing
      id: build_timing
      shell: bash
      env:
        BUILD_STARTED_AT: ${{ steps.build_timer.outputs.started_at }}
      run: echo "build_seconds=$(( $(date +%s) - BUILD_STARTED_AT ))" >> "$GITHUB_OUTPUT"
    - name: Verify the Hugo build
      shell: bash
      run: |
        set -euo pipefail
        artifact="$(go env GOPATH)/bin/dragonfly_amd64/hugo"
        test -x "$artifact"
        test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

    - name: Retain publish evidence
      if: inputs.strategy == 'boringcache' && inputs.phase == 'publish'
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.benchmark_id }}-${{ inputs.cache_lane }}-publish
        path: ${{ steps.boringcache-publish.outputs.evidence-path }}
        if-no-files-found: error

    - name: Retain warm evidence
      if: inputs.strategy == 'boringcache' && inputs.phase == 'warm'
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.benchmark_id }}-fresh-restore
        path: ${{ steps.boringcache-restore.outputs.evidence-path }}
        if-no-files-found: error
    - name: Write the benchmark phase evidence
      shell: bash
      env:
        BENCHMARK_ID: ${{ inputs.benchmark_id }}
        STRATEGY: ${{ inputs.strategy }}
        CACHE_LANE: ${{ inputs.cache_lane }}
        REPORT_PHASE: ${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase == 'warm' && 'warm' || 'cold' }}
        WORKFLOW_STARTED_AT: ${{ steps.workflow_timer.outputs.started_at }}
        SETUP_SECONDS: ${{ steps.build_timer.outputs.setup_seconds }}
        BUILD_SECONDS: ${{ steps.build_timing.outputs.build_seconds }}
        CACHE_HIT: ${{ steps.boringcache-publish.outputs.cache-hit || steps.boringcache-restore.outputs.cache-hit }}
        CACHE_IMPORT_READY: ${{ steps.boringcache-publish.outputs.docker-cache-import-ready || steps.boringcache-restore.outputs.docker-cache-import-ready }}
        CACHE_TAG: ${{ steps.boringcache-publish.outputs.cache-tag || steps.boringcache-restore.outputs.cache-tag }}
        CACHE_WORKSPACE: ${{ steps.boringcache-publish.outputs.workspace || steps.boringcache-restore.outputs.workspace }}
        EVIDENCE_PATH: ${{ steps.boringcache-publish.outputs.evidence-path || steps.boringcache-restore.outputs.evidence-path }}
        SOURCE_REPOSITORY: ${{ steps.scope.outputs.source_repository }}
        SOURCE_SHA: ${{ steps.scope.outputs.source_sha }}
      run: |
        set -euo pipefail
        python3 ./scripts/benchmark-report.py phase \
          --benchmark "$BENCHMARK_ID" \
          --strategy "$STRATEGY" \
          --lane "$CACHE_LANE" \
          --phase "$REPORT_PHASE" \
          --mode go \
          --restore-or-setup-seconds "$SETUP_SECONDS" \
          --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
          --build-seconds "$BUILD_SECONDS" \
          --cache-hit "$CACHE_HIT" \
          --cache-import-ready "$CACHE_IMPORT_READY" \
          --cache-tag "$CACHE_TAG" \
          --workspace "$CACHE_WORKSPACE" \
          --source-repository "$SOURCE_REPOSITORY" \
          --source-sha "$SOURCE_SHA" \
          --evidence "$EVIDENCE_PATH"
    - name: Retain the benchmark phase evidence
      uses: actions/upload-artifact@v6
      with:
        name: phase-${{ inputs.benchmark_id }}-${{ inputs.strategy }}-${{ inputs.cache_lane }}-${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase == 'warm' && 'warm' || 'cold' }}
        path: benchmark-results/
        if-no-files-found: error
